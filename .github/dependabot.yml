version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Held until the Node 20 drop in 0.2.0 (#13): these majors need Node >= 22,
    # or must move together with eslint. Remove an entry when its upgrade lands.
    ignore:
      - dependency-name: commander
        update-types: [version-update:semver-major]
      - dependency-name: tsup
        update-types: [version-update:semver-major]
      - dependency-name: esbuild
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # @types/node follows the lowest supported Node major, not the newest.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
