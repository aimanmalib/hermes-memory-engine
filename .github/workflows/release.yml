name: Release

# Publishes to npm only when a GitHub Release is published (e.g. tag v0.1.1).
# Merges and pushes to main never publish.
#
# Auth: npm Trusted Publishing (OIDC) — no token to create, store or rotate. Configure once on npmjs.com:
# package → Settings → Trusted Publisher → GitHub Actions, repository aimanmalib/hermes-memory-engine,
# workflow release.yml, environment npm, allowed to publish directly. npm uses OIDC when it is available and falls back to NPM_TOKEN if that secret is set.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the "Environment name" in the npm Trusted Publisher; the GitHub environment only accepts v* tags.
    environment:
      name: npm
      url: https://www.npmjs.com/package/hermes-memory-engine
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: npm --version
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Provenance is automatic with Trusted Publishing; the flag keeps it on for the token fallback.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
